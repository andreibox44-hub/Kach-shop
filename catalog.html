<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Каталог — Kach</title>
  <meta name="description" content="Каталог натуральных шампуней Kach.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌿%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="catalog">
  <header id="site-header"></header>
  <main>
    <section class="section">
      <div class="container">
        <h1>Каталог</h1>
        <div class="toolbar">
          <div class="chips" id="filters" aria-label="Тип волос"></div>
          <label class="small muted">Сортировка:
            <select id="sort">
              <option value="default">По популярности</option>
              <option value="cheap">Сначала дешевле</option>
              <option value="expensive">Сначала дороже</option>
            </select>
          </label>
        </div>
        <div class="grid" id="catalog-grid"></div>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/products.js"></script>
  <script src="js/art.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
