<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Оформление заказа — KACH</title>
  <meta name="description" content="Оформление заказа в магазине KACH.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌿%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css?v=09099">
</head>
<body data-page="checkout">
  <header id="site-header"></header>
  <main>
    <section class="section">
      <div class="container" id="checkout">
        <h1>Оформление заказа</h1>
        <div class="checkout-layout">
          <form class="form" id="checkout-form" novalidate>
            <fieldset>
              <legend>Контактные данные</legend>
              <p class="login-hint" id="login-hint" hidden>Есть аккаунт? <a href="account.html">Войдите</a>, чтобы данные подставились сами и заказ сохранился в истории.</p>
              <div class="field"><label for="name">Имя и фамилия *</label><input id="name" name="name" required autocomplete="name"></div>
              <div class="field-row">
                <div class="field"><label for="phone">Телефон *</label><input id="phone" name="phone" type="tel" required minlength="10" placeholder="+40 700 000 000" autocomplete="tel"></div>
                <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email"></div>
              </div>
            </fieldset>
            <fieldset>
              <legend>Доставка</legend>
              <label class="radio"><input type="radio" name="delivery" value="courier" checked><span><strong>Курьером</strong><br><span class="muted small">До двери</span></span></label>
              <label class="radio"><input type="radio" name="delivery" value="post"><span><strong>Почтой</strong><br><span class="muted small">В ваше почтовое отделение</span></span></label>
              <div class="field"><label for="country">Страна доставки *</label><select id="country" name="country" required autocomplete="country"></select></div>
              <div id="addr-fields"></div>
            </fieldset>
            <fieldset>
              <legend>Оплата</legend>
              <p class="pay-test" id="pay-test" hidden>Оплата работает в тестовом режиме: деньги не списываются.</p>
              <label class="radio" id="pay-card"><input type="radio" name="payment" value="card" checked><span><strong>Картой онлайн</strong><br><span class="pay pay-inline" data-pay-badges></span><span class="muted small">Безопасная оплата через Stripe</span></span></label>
              <label class="radio" id="pay-paypal" hidden><input type="radio" name="payment" value="paypal"><span><strong>PayPal</strong><br><span class="muted small">Через аккаунт PayPal или картой</span></span></label>
              <p class="form-msg err" id="pay-unavailable" hidden></p>
            </fieldset>
            <div class="field"><label for="comment">Комментарий к заказу</label><textarea id="comment" name="comment" rows="3"></textarea></div>
            <label class="small muted"><input type="checkbox" required> Я согласен(на) на обработку <a href="info.html#privacy">персональных данных</a> *</label>
            <button class="btn btn-block" type="submit">Перейти к оплате</button>
          </form>
          <aside class="summary" id="order-summary"></aside>
        </div>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/products.js?v=09099"></script>
  <script src="js/countries.js?v=09099"></script>
  <script src="js/vendor/supabase.js?v=09099"></script>
  <script src="js/supabase-config.js?v=09099"></script>
  <script src="js/auth.js?v=09099"></script>
  <script src="js/app.js?v=09099"></script>
</body>
</html>
